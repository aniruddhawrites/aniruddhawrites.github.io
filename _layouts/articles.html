---
layout: page
---
{{ content }}

  {% for post in site.posts %}
    <article class="post-card">
      <div class="card-top"><span>{{ post.category }}</span><span>{{ post.date | date: "%b %d, %Y" }}</span></div>
      <h3>{{ post.title }}</h3>
      <p>{{ post.excerpt | strip_html | truncatewords: 30 }}</p>
      <div class="tag-list">{% for tag in post.tags %}<span class="tag">{{ tag }}</span>{% endfor %}</div>
      <a href="{{ post.url }}" class="post-link">Read article →</a>
    </article>
  {% endfor %}
